<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Proposta comercial</title>
<style>
:root{--or:#E85D00;--or2:#FF6600;--ink:#1E1A18;--mu:#6E625B;--ln:#E6DED8;--soft:#F7F3F0;--bg:#EFEAE6;--ok:#1F9D55}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{background:#141110;color:#fff;border-bottom:3px solid var(--or);padding:18px 16px 16px}
.wrap{max-width:860px;margin:0 auto}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px}.logo span{color:var(--or2)}
.tag{color:#BDB3AC;font-size:12px;margin-top:2px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.pn{text-align:right}.pn small{display:block;color:var(--or2);font-weight:700;font-size:11px;letter-spacing:1px}.pn b{font-size:20px}
main{padding:16px 16px 120px}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:19px;margin:0 0 4px}.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.grid div{background:var(--soft);border-radius:10px;padding:9px 11px}.grid small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.5px}.grid b{font-size:14px}
.it{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--ln)}.it:first-child{border-top:0;padding-top:4px}
.th{width:96px;height:96px;background:var(--soft);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.th svg{width:86px;height:86px}.th .sd{font-size:10px;font-weight:800;color:var(--mu)}
.nm{font-weight:700}.ln2{color:var(--mu);font-size:13px}
.pr{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;gap:8px;flex-wrap:wrap}.pr span{color:var(--mu);font-size:13px}.pr b{font-size:15px}
.tot{display:flex;justify-content:space-between;align-items:center;gap:10px}.tot b{font-size:26px;color:var(--ink)}
.venc{background:#FFF4E5;border:1px solid #F5C58A;color:#7A4A00;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--ln);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;gap:8px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 14px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid var(--ln);background:#fff;color:var(--ink);cursor:pointer}
.btn.ap{background:var(--ok);border-color:var(--ok);color:#fff;flex:1.6}
.err{max-width:520px;margin:60px auto;text-align:center;padding:0 16px}
footer{text-align:center;color:var(--mu);font-size:12px;margin-top:18px}
@media print{.bar{display:none}body{background:#fff}main{padding-bottom:0}.card{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="wrap top"><div><div class="logo" id="lg"></div><div class="tag" id="sl"></div></div><div class="pn"><small>PROPOSTA COMERCIAL</small><b id="pn"></b></div></div></header>
<main><div class="wrap" id="app"><p class="mu">Abrindo a proposta…</p></div></main>
<div class="bar" id="bar" hidden><div class="wrap"><a class="btn" id="aj" target="_blank" rel="noopener">Pedir ajuste</a><a class="btn ap" id="ap" target="_blank" rel="noopener">✓ Aprovar pelo WhatsApp</a></div></div>
<script>
(async () => {
  const $ = id => document.getElementById(id), app = $('app');
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const brl = v => (+v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const fail = m => { app.innerHTML = ''; const d = el('div', 'err'); d.append(el('h1', null, 'Não foi possível abrir a proposta'), el('p', 'mu', m)); app.append(d); };
  let P;
  try {
    const h = location.hash.slice(1); if (!h) return fail('O link está incompleto. Peça um novo link para quem enviou a proposta.');
    const b = atob(h.replace(/-/g, '+').replace(/_/g, '/')), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    const st = new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw')); P = JSON.parse(await new Response(st).text());
  } catch (e) { return fail('O link está incompleto ou foi cortado. Peça um novo link para quem enviou a proposta.'); }
  const E = P.emp || {}, nm = String(E.n || 'Empresa'), cor = /^#[0-9a-f]{3,8}$/i.test(E.c || '') ? E.c : '#E85D00', cor2 = /^#[0-9a-f]{3,8}$/i.test(E.c2 || '') ? E.c2 : cor;
  // marca da empresa que mandou o orçamento (vem no link): nome em duas partes, slogan e cores
  document.documentElement.style.setProperty('--or', cor); document.documentElement.style.setProperty('--or2', cor2);
  const lg = $('lg'), ma = Array.isArray(E.ma) && E.ma[0] ? E.ma : (/^GUIMETAL$/i.test(nm) ? ['GUI', 'METAL'] : [nm.toUpperCase(), '']);
  lg.append(String(ma[0])); if (ma[1]) lg.append(el('span', null, String(ma[1])));
  $('sl').textContent = E.sl != null ? E.sl : (/^GUIMETAL$/i.test(nm) ? 'Corte a laser · dobra · solda · acabamento' : '');
  $('pn').textContent = P.n || ''; document.title = 'Proposta ' + (P.n || '') + ' · ' + nm;
  app.innerHTML = '';
  const em = P.em ? new Date(P.em + 'T12:00:00') : new Date(), vence = new Date(em.getTime() + (P.val || 15) * 864e5), venc = Date.now() > vence.getTime();
  if (venc) app.append(el('div', 'venc', 'Esta proposta venceu em ' + vence.toLocaleDateString('pt-BR') + '. Os valores podem ter mudado: peça uma atualização pelo botão "Pedir ajuste".'));
  const c1 = el('div', 'card'); c1.append(el('h1', null, P.tit || 'Proposta para ' + (P.cli || 'você')), el('div', 'mu', (P.cli ? P.cli + ' · ' : '') + 'Emitida em ' + em.toLocaleDateString('pt-BR') + ' · válida até ' + vence.toLocaleDateString('pt-BR')));
  const g = el('div', 'grid'); for (const [k, v] of [['Prazo de entrega', P.pz], ['Pagamento', P.pg], ['Frete', P.fr], ['Atendimento', P.vend]]) if (v) { const d = el('div'); d.append(el('small', null, k), el('b', null, v)); g.append(d); } c1.append(g); app.append(c1);
  const c2 = el('div', 'card'); c2.append(el('h1', null, 'Itens')); const lst = el('div');
  const NS = 'http://www.w3.org/2000/svg';
  for (const x of P.it || []) { const r = el('div', 'it'), th = el('div', 'th');
    if (x.s && x.s.length && x.w > 0 && x.h > 0) { const k = 80 / Math.max(x.w, x.h), W = x.w * k, H = x.h * k, sv = document.createElementNS(NS, 'svg'); sv.setAttribute('viewBox', (-3 - (80 - W) / 2) + ' ' + (-3 - (80 - H) / 2) + ' 86 86');
      const pa = document.createElementNS(NS, 'path'); pa.setAttribute('d', x.s.map(pl => 'M' + pl.map(p => (p[0] * W).toFixed(2) + ' ' + ((1 - p[1]) * H).toFixed(2)).join('L') + 'Z').join(''));
      pa.style.fill = 'var(--or)'; pa.style.fillOpacity = '.22'; pa.setAttribute('fill-rule', 'evenodd'); pa.style.stroke = 'var(--or)'; pa.setAttribute('stroke-width', '0.8'); sv.append(pa); th.append(sv); }
    else th.append(el("span", "sd", x.d === "Adicionais do pedido" ? "+" : x.solda ? "SOLDA" : "PEÇA"));
    const tx = el('div'); tx.append(el('div', 'nm', x.d || 'Peça'));
    tx.append(el('div', 'ln2', [x.c ? 'Cód. ' + x.c : '', x.md].filter(Boolean).join(' · ')));
    tx.append(el('div', 'ln2', [x.m, x.db ? x.db + (x.db > 1 ? ' dobras' : ' dobra') : ''].filter(Boolean).join(' · ')));
    const pr = el('div', 'pr'); pr.append(el('span', null, (x.q || 1).toLocaleString('pt-BR') + ' × ' + brl(x.u)), el('b', null, brl(x.t))); tx.append(pr);
    r.append(th, tx); lst.append(r); }
  c2.append(lst); app.append(c2);
  const c3 = el('div', 'card'), t = el('div', 'tot'); t.append(el('div', null, 'Total da proposta'), el('b', null, brl(P.tot))); c3.append(t); app.append(c3);
  const ft = el('footer'); ft.append(el('div', null, [E.r, E.f, E.e].filter(Boolean).join(' · '))); app.append(ft);
  const wa = String(E.w || '').replace(/\D/g, '');
  if (wa) { $('ap').href = 'https://wa.me/' + wa + '?text=' + encodeURIComponent(P.am || ('Aprovo a proposta ' + (P.n || '') + '.'));
    $('aj').href = 'https://wa.me/' + wa + '?text=' + encodeURIComponent('Olá! Sobre a proposta ' + (P.n || '') + ', gostaria de ajustar: ');
    if (venc) { $('ap').textContent = 'Pedir proposta atualizada'; $('ap').href = $('aj').href; }
    $('bar').hidden = false; }
})();
</script>
</body>
</html>
